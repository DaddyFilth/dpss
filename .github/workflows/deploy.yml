name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Prisma Compute
        uses: prisma/project-compute/github-action@main
        with:
          api-token: ${{ secrets.PRISMA_API_TOKEN }}
          compute-service-id: ${{ secrets.PRISMA_COMPUTE_SERVICE_ID }}
